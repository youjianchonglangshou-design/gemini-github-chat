<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="可部署到 GitHub Pages 的 Gemini 對話介面" />
  <title>Gemini Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="側邊欄">
      <div class="brand-row">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-title">Gemini Chat</div>
          <div class="brand-subtitle">GitHub Pages Edition</div>
        </div>
        <button class="icon-button sidebar-close" id="sidebarClose" aria-label="關閉側邊欄">×</button>
      </div>

      <button class="primary-button new-chat-button" id="newChatButton">
        <span>＋</span> 新對話
      </button>

      <div class="sidebar-section-label">對話紀錄</div>
      <div class="conversation-list" id="conversationList"></div>

      <div class="sidebar-footer">
        <button class="sidebar-action" id="exportButton">匯出目前對話</button>
        <button class="sidebar-action" id="settingsButton">設定</button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main-panel">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="開啟側邊欄">☰</button>
        <div class="model-status">
          <strong id="headerTitle">新對話</strong>
          <span><i class="status-dot"></i><span id="modelLabel">gemini-2.5-flash</span></span>
        </div>
        <button class="icon-button" id="topSettingsButton" aria-label="開啟設定">⚙</button>
      </header>

      <section class="chat-scroll" id="chatScroll">
        <div class="messages" id="messages" aria-live="polite"></div>

        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h1>今天想討論什麼？</h1>
          <p>使用 Gemini 2.5 Flash 的簡潔對話介面。API Key 僅保存在目前瀏覽器。</p>
          <div class="suggestion-grid">
            <button class="suggestion" data-prompt="幫我整理今天最重要的三項工作，並排出優先順序。">
              <strong>整理工作</strong><span>規劃今日優先順序</span>
            </button>
            <button class="suggestion" data-prompt="請用簡單例子解釋大型語言模型是如何運作的。">
              <strong>解釋概念</strong><span>把複雜內容說清楚</span>
            </button>
            <button class="suggestion" data-prompt="幫我檢查下面這段文字並改得更自然：">
              <strong>改善文字</strong><span>修正文句與語氣</span>
            </button>
            <button class="suggestion" data-prompt="請先問我三個問題，再幫我設計一個可執行的學習計畫。">
              <strong>制定計畫</strong><span>建立可落地的步驟</span>
            </button>
          </div>
        </div>
      </section>

      <div class="composer-area">
        <div class="composer-wrap">
          <textarea id="promptInput" rows="1" placeholder="輸入訊息…（Enter 傳送，Shift + Enter 換行）" aria-label="訊息輸入"></textarea>
          <button class="send-button" id="sendButton" aria-label="傳送訊息">➤</button>
        </div>
        <div class="composer-note">Gemini 可能產生不正確資訊，重要內容請自行確認。</div>
      </div>
    </main>
  </div>

  <dialog class="settings-dialog" id="settingsDialog">
    <form method="dialog" class="settings-card" id="settingsForm">
      <div class="dialog-header">
        <div>
          <h2>模型設定</h2>
          <p>資料只儲存在你的瀏覽器 localStorage。</p>
        </div>
        <button class="icon-button" value="cancel" aria-label="關閉設定">×</button>
      </div>

      <label class="field">
        <span>Gemini API Key</span>
        <div class="password-wrap">
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="貼上 Google AI Studio API Key" />
          <button type="button" class="text-button" id="toggleKeyButton">顯示</button>
        </div>
        <small>GitHub Pages 是公開前端，請勿把 Key 寫入程式或提交到儲存庫。</small>
      </label>

      <label class="field">
        <span>Base URL</span>
        <input id="baseUrlInput" type="url" value="https://generativelanguage.googleapis.com/v1beta" />
      </label>

      <label class="field">
        <span>模型名稱</span>
        <input id="modelInput" type="text" value="gemini-2.5-flash" />
      </label>

      <label class="field">
        <span>系統提示詞</span>
        <textarea id="systemPromptInput" rows="4" placeholder="例如：請使用繁體中文回答，內容清楚、精確。"></textarea>
      </label>

      <label class="field range-field">
        <span>Temperature <output id="temperatureOutput">0.7</output></span>
        <input id="temperatureInput" type="range" min="0" max="2" step="0.1" value="0.7" />
      </label>

      <div class="dialog-actions">
        <button type="button" class="danger-button" id="clearAllButton">清除全部資料</button>
        <span class="dialog-spacer"></span>
        <button value="cancel" class="secondary-button">取消</button>
        <button value="default" class="primary-button" id="saveSettingsButton">儲存設定</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
